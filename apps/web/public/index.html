<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>SicherheitsTool Schule</title></head><body><header class="top"><h1>Sicherheitsmanagement für Schulen</h1><p id="sync">Synchronisationsstatus: wird geladen</p></header><main class="grid"><section class="card"><h2>Live-Dashboard</h2><div id="dashboard"></div><button class="btn" id="snapshot">Anwesenheits-Snapshot erzeugen</button><a class="btn secondary" href="/api/exports/attendance.csv?exerciseId=ex1">CSV-Anwesenheitsliste</a></section><section class="card"><h2>Mobile Schnellmeldung</h2><div class="mobile-actions"><button class="btn" id="complete">✅ Klasse vollständig</button><button class="btn secondary" id="missing">⚠️ Person fehlt</button><button class="btn secondary" id="blocked">⛔ Fluchtweg blockiert</button></div><p id="mobileResult" class="status">Bereit. Meldungen werden bei Netzausfall lokal gespeichert.</p></section><section class="card"><h2>Übungsplanung</h2><form id="exerciseForm"><input name="title" value="Probealarm Gebäudeteil A"><input name="date" type="date" value="2026-07-13"><textarea name="scenario">Rauchentwicklung im Chemietrakt; Abbruch bei realem Notfall.</textarea><button class="btn">Übung anlegen</button></form></section><section class="card"><h2>Infoportal / Import</h2><input id="portal" value="meine-schule"><button class="btn" id="portalSave">Schulkennung speichern</button><button class="btn secondary" id="demoImport">Demo-/CSV-Import ausführen</button><pre id="portalOut"></pre></section><section class="card"><h2>Formularvorlagen</h2><ul id="forms"></ul></section><section class="card"><h2>Offline-Warteschlange</h2><pre id="queue"></pre></section></main><script src="/app.js"></script></body></html>
